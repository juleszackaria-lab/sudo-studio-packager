name: PROBE cmd parens (temporary diagnostics)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: '03 run id holding SudoStudio-Installer artifact'
        required: false
        default: '39852674865'

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download installer artifact
        uses: dawidd6/action-download-artifact@v5
        with:
          run_id: ${{ inputs.artifact_run_id }}
          name: SudoStudio-Installer
          path: probe-dl

      - name: Install to paren path
        shell: powershell
        run: |
          $dir = 'C:\ptest (x86)\Probe'
          if (Test-Path 'C:\ptest (x86)') { Remove-Item 'C:\ptest (x86)' -Recurse -Force }
          $ip = Start-Process -FilePath (Join-Path (Get-Location) 'probe-dl\SudoStudio-Setup.exe') -ArgumentList '/SILENT','/NORESTART',("/DIR=$dir") -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw 'probe install failed' }
          if (-not (Test-Path (Join-Path $dir 'start.bat'))) { throw 'start.bat missing after install' }
          if (-not (Test-Path (Join-Path $dir 'SudoStudio.exe'))) { throw 'exe missing after install' }
          Get-ChildItem $dir -File | Select-Object Name, Length | Out-Host

      - name: Micro-probes (each construct, paren dir + plain dir)
        shell: powershell
        run: |
          $parenDir = 'C:\ptest (x86)\Probe'
          $plainDir = Join-Path (Get-Location) 'plainProbe'
          New-Item -ItemType Directory -Force -Path $plainDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $parenDir '_probe') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path (Get-Location) 'probe-out') | Out-Null
          # plain dir needs the exe the TRUE-condition probes test for
          Copy-Item (Join-Path $parenDir 'SudoStudio.exe') (Join-Path $plainDir 'SudoStudio.exe') -Force

          function Run-Cmd([string]$argLine, [string]$workdir, [int]$timeoutMs) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'C:\Windows\System32\cmd.exe'
            $psi.Arguments = $argLine
            $psi.WorkingDirectory = $workdir
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.RedirectStandardInput = $true
            $psi.CreateNoWindow = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.StandardInput.Close()
            $exited = $p.WaitForExit($timeoutMs)
            if (-not $exited) { try { $p.Kill() } catch {} }
            return @{ exited = $exited; code = $(if ($exited) { $p.ExitCode } else { 'HANG' });
              so = $p.StandardOutput.ReadToEnd(); se = $p.StandardError.ReadToEnd() }
          }

          $cases = @(
            @{ n = 'm0-bare-launch'; bat = @('@echo off', 'echo M0-HELLO', 'echo M0-DP0-IS %~dp0', 'echo M0-SURVIVED');
               args = '/c m0.bat' },
            @{ n = 'm1-cond-true-set'; bat = @('@echo off', 'if exist "%~1\SudoStudio.exe" set "X=1"', 'echo M1-X=%X%', 'echo M1-SURVIVED');
               args = $null },
            @{ n = 'm2-cond-false-set'; bat = @('@echo off', 'if exist "%~1\nonexistent-dir-xyz" set "X=1"', 'echo M2-X=%X%', 'echo M2-SURVIVED');
               args = $null },
            @{ n = 'm3-not-false-set'; bat = @('@echo off', 'if not exist "%~1\nonexistent-dir-xyz" set "X=1"', 'echo M3-X=%X%', 'echo M3-SURVIVED');
               args = $null },
            @{ n = 'm4-cond-block'; bat = @('@echo off', 'if exist "%~1\SudoStudio.exe" (', 'echo M4-IN-BLOCK', ')', 'echo M4-SURVIVED');
               args = $null },
            @{ n = 'm5-flag-body-echo'; bat = @('@echo off', 'set "F=0"', 'if exist "%~1\SudoStudio.exe" set "F=1"', 'if "%F%"=="1" (', 'echo M5-PATH-IS %~1', ')', 'echo M5-SURVIVED');
               args = $null },
            @{ n = 'm6-flag-body-redirect'; bat = @('@echo off', 'set "F=0"', 'if exist "%~1\SudoStudio.exe" set "F=1"', 'if "%F%"=="1" (', 'echo hit "%~1\SudoStudio.exe" > "%~1\_probe\hit.txt"', ')', 'echo M6-SURVIVED');
               args = $null },
            @{ n = 'm7-bang'; bat = @('@echo off', 'setlocal enabledelayedexpansion', 'set "P=%~1"', 'if "1"=="1" (', 'echo M7-PATH-IS !P!', ')', 'echo M7-SURVIVED');
               args = $null },
            @{ n = 'm8-initblock'; bat = @('@echo off', '( echo M8-LINE1 & echo M8-PATH-IS %~1 & echo M8-LINE3 ) > "%~1\_probe\m8.log"', 'echo M8-SURVIVED', 'type "%~1\_probe\m8.log"');
               args = $null }
          )

          $summary = @()
          foreach ($dir in @($parenDir, $plainDir)) {
            $tag = $(if ($dir -eq $parenDir) { 'PAREN' } else { 'PLAIN' })
            foreach ($c in $cases) {
              $batPath = Join-Path $dir '_probe'
              if ($dir -eq $plainDir) { $batPath = Join-Path $plainDir '_probe'; New-Item -ItemType Directory -Force -Path $batPath | Out-Null }
              $batFile = Join-Path $batPath ($c.n + '.bat')
              $c.bat | Set-Content $batFile -Encoding ascii
              $argLine = $(if ($c.args) { $c.args } else { '/d /c ""' + $batFile + '" "' + $dir + '""' })
              if ($c.n -eq 'm0-bare-launch') { $argLine = '/c m0.bat' }
              $r = Run-Cmd $argLine $batPath 15000
              $one = ('[{0}] {1}: exited={2} code={3} survived={4}' -f $tag, $c.n, $r.exited, $r.code, ($r.so -like '*SURVIVED*'))
              $one | Out-Host
              ('--- stdout ---' + "`r`n" + $r.so + "`r`n" + '--- stderr ---' + "`r`n" + $r.se) | Set-Content (Join-Path (Get-Location) ('probe-out\' + $tag + '-' + $c.n + '.log')) -Encoding ascii
              $summary += $one
            }
          }
          '' | Out-Host
          '================ SUMMARY ================' | Out-Host
          $summary | Out-Host

      - name: Full start.bat run on paren path (7 min max)
        shell: powershell
        run: |
          $parenDir = 'C:\ptest (x86)\Probe'
          $cap = Join-Path (Get-Location) 'probe-out\full-stdout.log'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = 'C:\Windows\System32\cmd.exe'
          $psi.Arguments = '/c start.bat'
          $psi.WorkingDirectory = $parenDir
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardInput = $true
          $psi.CreateNoWindow = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.Close()
          $exited = $p.WaitForExit(420000)
          if (-not $exited) { try { $p.Kill() } catch {} }
          ('exited=' + $exited + ' code=' + $(if ($exited) { $p.ExitCode } else { 'RUNNING-AT-TIMEOUT' })) | Out-Host
          ('--- stdout ---' + "`r`n" + $p.StandardOutput.ReadToEnd() + "`r`n" + '--- stderr ---' + "`r`n" + $p.StandardError.ReadToEnd()) | Set-Content $cap -Encoding ascii
          $logf = Join-Path $env:LOCALAPPDATA 'SudoStudio\logs\startup.log'
          if (Test-Path $logf) { '--- startup.log tail ---' | Out-Host; Get-Content $logf -Tail 25 | Out-Host; Copy-Item $logf (Join-Path (Get-Location) 'probe-out\full-startup.log') -Force }
          else { 'NO startup.log after full run' | Out-Host }
          '--- capture tail ---' | Out-Host
          Get-Content $cap -Tail 40 | Out-Host

      - name: Cleanup probe install
        if: always()
        shell: powershell
        run: |
          Get-Process -Name 'backend','runtime','SudoStudio' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $un = 'C:\ptest (x86)\Probe\unins000.exe'
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/SILENT','/NORESTART' -Wait }
          Remove-Item 'C:\ptest (x86)' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload probe captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-cmd
          path: probe-out/
