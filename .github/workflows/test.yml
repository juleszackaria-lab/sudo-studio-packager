name: Test Runner

# TEMP EXPERIMENT 2 (2026-10-18): does the 17/10 installer (WITHOUT the new
# [InstallDelete] section) also hang silently? If OLD works, capture
# forensics on the NEW installer hang. No rebuild. REVERT after diagnosis.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download 17/10 installer (no InstallDelete)
        uses: dawidd6/action-download-artifact@v5
        with:
          run_id: 39076854816
          name: SudoStudio-Installer
          path: exp2-dl-old

      - name: Download NEW installer (with InstallDelete)
        uses: dawidd6/action-download-artifact@v5
        with:
          run_id: 39162429983
          name: SudoStudio-Installer
          path: exp2-dl-new

      - name: Run OLD installer silent (6 min cap)
        shell: powershell
        run: |
          $setup = Join-Path (Get-Location) 'exp2-dl-old\SudoStudio-Setup.exe'
          Write-Host ("[OLD] file present: {0}" -f (Test-Path $setup))
          $dir = Join-Path $env:TEMP 'ExpOld'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $log = Join-Path (Get-Location) 'exp2-old-inno.log'
          $p = Start-Process -FilePath $setup -ArgumentList '/SILENT','/NORESTART',("/DIR=$dir"),("/LOG=$log") -PassThru
          $deadline = (Get-Date).AddSeconds(360)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) { Start-Sleep -Seconds 10 }
          if (-not $p.HasExited) {
            Write-Host '[OLD] RESULT: HUNG (killed after 360 s)'
            try { Stop-Process -Id $p.Id -Force } catch {}
          } else {
            Write-Host ("[OLD] RESULT: exited code={0}" -f $p.ExitCode)
          }
          Write-Host ("[OLD] SudoStudio.exe present: {0}" -f (Test-Path (Join-Path $dir 'SudoStudio.exe')))
          Write-Host ("[OLD] inno log written: {0}" -f (Test-Path $log))

      - name: Forensics on NEW installer (only if OLD worked)
        shell: powershell
        run: |
          if (-not (Test-Path (Join-Path $env:TEMP 'ExpOld\SudoStudio.exe'))) {
            Write-Host '[FORENSIC] OLD did not install - nothing to compare, skip'
            exit 0
          }
          $setup = Join-Path (Get-Location) 'exp2-dl-new\SudoStudio-Setup.exe'
          $dir = Join-Path $env:TEMP 'ExpNew'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $log = Join-Path (Get-Location) 'exp2-new-inno.log'
          $p = Start-Process -FilePath $setup -ArgumentList '/SILENT','/NORESTART',("/DIR=$dir"),("/LOG=$log") -PassThru
          Start-Sleep -Seconds 90
          if ($p.HasExited) {
            Write-Host ("[FORENSIC] NEW exited by itself code={0} (no hang?!)" -f $p.ExitCode)
          } else {
            $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            Write-Host ("[FORENSIC] NEW still running: cpu={0}s responding={1} title=[{2}]" -f $proc.CPU, $proc.Responding, $proc.MainWindowTitle)
            Get-CimInstance Win32_Process -Filter ("ParentProcessId={0}" -f $p.Id) | ForEach-Object { Write-Host ("[FORENSIC] child: {0} pid={1}" -f $_.Name, $_.ProcessId) }
            Get-Process | Where-Object { $_.MainWindowTitle -ne '' } | ForEach-Object { Write-Host ("[FORENSIC] window: {0} title=[{1}]" -f $_.ProcessName, $_.MainWindowTitle) }
            $tmp = Get-ChildItem (Join-Path $env:TEMP 'is-*.tmp') -Directory -ErrorAction SilentlyContinue
            Write-Host ("[FORENSIC] is-*.tmp dirs: {0}" -f (($tmp | ForEach-Object { $_.Name }) -join ','))
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $g.Dispose()
          $bmp.Save((Join-Path (Get-Location) 'exp2-forensic.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Write-Host '[FORENSIC] screenshot saved'
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          $un = Join-Path $dir 'unins000.exe'
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/SILENT','/NORESTART' -Wait }
          $unOld = Join-Path $env:TEMP 'ExpOld\unins000.exe'
          if (Test-Path $unOld) { Start-Process -FilePath $unOld -ArgumentList '/SILENT','/NORESTART' -Wait }

      - name: Upload experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-old-installer
          path: |
            exp2-old-inno.log
            exp2-new-inno.log
            exp2-forensic.png
          if-no-files-found: warn
