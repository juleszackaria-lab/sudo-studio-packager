name: SudoStudio Stable Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  BACKEND_RUN_ID: "33611193565"
  RUNTIME_RUN_ID: "35201176995"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read

    steps:
      # -- 1. Checkout this repo ------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      # -- 1b. Checkout Sudo-studio repo ----------------------------------------
      - name: Checkout sudo-ai-extension from Sudo-studio
        uses: actions/checkout@v4
        with:
          repository: juleszackaria-lab/Sudo-studio
          path: _sudo-studio-source
          ref: main
          token: ${{ secrets.PAT }}

      # -- 2. Copy sudo-ai-extension --------------------------------------------
      - name: Copy sudo-ai-extension into workspace
        shell: cmd
        run: |
          if exist _sudo-studio-source\sudo-ai-extension (
            xcopy _sudo-studio-source\sudo-ai-extension sudo-ai-extension /E /I /Y /Q
            echo sudo-ai-extension copied from Sudo-studio repo.
          ) else (
            echo ERROR: sudo-ai-extension not found in Sudo-studio repo
            dir _sudo-studio-source
            exit /b 1
          )

      # -- 3. Download backend.exe ----------------------------------------------
      - name: Download backend.exe (by run ID)
        uses: dawidd6/action-download-artifact@v5
        with:
          repo: juleszackaria-lab/Sudo-studio
          run_id: ${{ env.BACKEND_RUN_ID }}
          name: backend-exe
          path: build/backend
          if_no_artifact_found: warn

      # -- 4. Download runtime.exe ----------------------------------------------
      - name: Download runtime.exe (by run ID)
        uses: dawidd6/action-download-artifact@v5
        with:
          repo: juleszackaria-lab/Sudo-studio
          run_id: ${{ env.RUNTIME_RUN_ID }}
          name: runtime-exe
          path: build/runtime
          if_no_artifact_found: warn

      # -- 5. Validate artifact binaries ----------------------------------------
      - name: Validate artifact binaries
        shell: powershell
        run: |
          $backendPath = "build\backend\backend.exe"
          $runtimePath = "build\runtime\server.exe"
          $MIN_SIZE_BYTES = 500000

          function Assert-Binary($p, $name) {
            if (-not (Test-Path $p)) {
              Write-Error "$name NOT FOUND at $p. Run workflow 01 / 02 first."
              exit 1
            }
            $size = (Get-Item $p).Length
            if ($size -lt $MIN_SIZE_BYTES) {
              Write-Error "$name is only $size bytes -- looks like a placeholder."
              exit 1
            }
            Write-Host "OK: $name ($([math]::Round($size/1MB,1)) MB)"
          }

          Assert-Binary $backendPath "backend.exe"
          Assert-Binary $runtimePath "runtime.exe (server.exe)"

      # -- 6. Setup Node.js -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -- 7. Install extension dependencies ------------------------------------
      - name: Install extension node_modules
        shell: cmd
        run: |
          cd sudo-ai-extension
          npm install --production
          echo Extension node_modules installed.

      # -- 8. Prepare build folders ---------------------------------------------
      - name: Prepare build folders
        shell: cmd
        run: |
          if not exist build mkdir build
          if not exist build\SudoStudio mkdir build\SudoStudio
          if not exist build\SudoStudio\extensions mkdir build\SudoStudio\extensions
          if not exist build\SudoStudio\data mkdir build\SudoStudio\data
          if not exist build\SudoStudio\logs mkdir build\SudoStudio\logs
          if not exist Output mkdir Output
          echo Folders created - structure synchronisee avec start.bat v4.1

      # -- 9. Download VSCodium portable ----------------------------------------
      - name: Download VSCodium portable
        shell: powershell
        run: |
          $ver = "1.97.2.25045"
          $url = "https://github.com/VSCodium/vscodium/releases/download/$ver/VSCodium-win32-x64-$ver.zip"
          Write-Host "Downloading VSCodium $ver..."
          Invoke-WebRequest $url -OutFile vscodium.zip -TimeoutSec 300
          Write-Host "VSCodium downloaded: $([math]::Round((Get-Item vscodium.zip).Length/1MB,1)) MB"

      # -- 10. Extract VSCodium a la RACINE -------------------------------------
      - name: Extract VSCodium to ROOT
        shell: powershell
        run: |
          Expand-Archive vscodium.zip build\SudoStudio -Force
          Write-Host "VSCodium extracted to ROOT."
          if (-not (Test-Path "build\SudoStudio\VSCodium.exe")) {
            Write-Error "VSCodium.exe not found at ROOT after extraction!"
            exit 1
          }
          Write-Host "VSCodium.exe confirmed at ROOT."

      # -- 10a. Provide valid logo.ico for branding ------------------------------
      # The branding script needs a REAL multi-resolution ICO. Sudo-studio's
      # resources\icon.ico is verified valid (6 sizes, 41KB) -- never a PNG
      # renamed to .ico (that broken approach was removed from step 11).
      - name: Provide valid logo.ico
        shell: powershell
        run: |
          $src = "_sudo-studio-source\resources\icon.ico"
          $dst = "build\SudoStudio\logo.ico"
          if (-not (Test-Path $src)) {
            Write-Error "[FAIL] Valid ICO source missing at $src -- cannot brand icons"
            exit 1
          }
          Copy-Item $src $dst -Force
          $magic = [System.IO.File]::ReadAllBytes($dst)[0..3]
          if (!($magic[0] -eq 0x00 -and $magic[1] -eq 0x00 -and $magic[2] -eq 0x01 -and $magic[3] -eq 0x00)) {
            Write-Error "[FAIL] $dst is NOT a valid ICO file (bad magic bytes)"
            exit 1
          }
          Write-Host "[OK] logo.ico ready: $([math]::Round((Get-Item $dst).Length/1KB,1)) KB, real ICO format"

      # -- 10b. Customize VSCodium branding to Sudo Studio ----------------------
      - name: Customize VSCodium branding
        shell: powershell
        run: |
          $scriptPath = "_sudo-studio-source\scripts\customize-vscodium.ps1"
          if (Test-Path $scriptPath) {
            & $scriptPath -VSCodiumDir "build\SudoStudio"
            Write-Host "VSCodium customized to Sudo Studio branding."
          } else {
            Write-Error "customize-vscodium.ps1 not found - refusing to ship an unbranded build."
            exit 1
          }

      # -- 10c. Patch exe icon + version strings with rcedit --------------------
      # This sets the taskbar / window-corner / Alt+Tab icon. Without it the app
      # keeps the stock VSCodium icon even if everything else is branded.
      - name: Patch exe icon with rcedit
        shell: powershell
        run: |
          npm install -g rcedit
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] npm install -g rcedit failed (exit $LASTEXITCODE)"
            exit 1
          }
          $exe = "build\SudoStudio\VSCodium.exe"
          $ico = "build\SudoStudio\logo.ico"
          if (-not (Test-Path $exe)) {
            Write-Error "[FAIL] $exe not found -- cannot patch executable icon"
            exit 1
          }
          if (-not (Test-Path $ico)) {
            Write-Error "[FAIL] $ico not found -- cannot patch executable icon"
            exit 1
          }
          rcedit $exe --set-icon $ico
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] rcedit --set-icon failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "[OK] rcedit: icon patched from $ico"
          rcedit $exe --set-version-string "ProductName"    "Sudo Studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit ProductName failed"; exit 1 }
          rcedit $exe --set-version-string "FileDescription" "Sudo Studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit FileDescription failed"; exit 1 }
          rcedit $exe --set-version-string "CompanyName"    "Sudo Studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit CompanyName failed"; exit 1 }
          rcedit $exe --set-version-string "InternalName"   "sudo-studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit InternalName failed"; exit 1 }
          Write-Host "[OK] rcedit: version strings patched"

      # -- 10d. Rename VSCodium.exe -> SudoStudio.exe -----------------------------
      # start.bat (v4.1+) already prefers SudoStudio.exe with VSCodium.exe
      # fallback, so the rename is safe. The tile manifest was already renamed
      # by the branding script (STEP 4e) to match.
      - name: Rename exe to SudoStudio.exe
        shell: powershell
        run: |
          $from = "build\SudoStudio\VSCodium.exe"
          $to = "build\SudoStudio\SudoStudio.exe"
          if (-not (Test-Path $from)) {
            Write-Error "[FAIL] $from not found -- cannot rename"
            exit 1
          }
          Move-Item $from $to -Force
          Write-Host "[OK] Renamed VSCodium.exe -> SudoStudio.exe"

      # -- 10e. Verify exe branding stuck -----------------------------------------
      - name: Verify SudoStudio.exe branding
        shell: powershell
        run: |
          $exe = "build\SudoStudio\SudoStudio.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "[FAIL] $exe not found after rename"
            exit 1
          }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "[VERIFY] ProductName: $($vi.ProductName) | FileDescription: $($vi.FileDescription) | Company: $($vi.CompanyName)"
          if ($vi.ProductName -ne "Sudo Studio") { Write-Error "[FAIL] ProductName not patched"; exit 1 }
          if ($vi.FileDescription -ne "Sudo Studio") { Write-Error "[FAIL] FileDescription not patched"; exit 1 }
          if ($vi.CompanyName -ne "Sudo Studio") { Write-Error "[FAIL] CompanyName not patched"; exit 1 }
          Write-Host "[OK] SudoStudio.exe branding verified"

      # -- 11. Copy executables a la RACINE -------------------------------------
      - name: Copy executables to ROOT
        shell: cmd
        run: |
          copy build\backend\backend.exe build\SudoStudio\backend.exe /Y
          echo backend.exe copied to ROOT.

          if exist build\runtime\server.exe (
            copy build\runtime\server.exe build\SudoStudio\runtime.exe /Y
            echo runtime.exe copied from server.exe to ROOT.
          ) else if exist build\runtime\runtime.exe (
            copy build\runtime\runtime.exe build\SudoStudio\runtime.exe /Y
            echo runtime.exe copied to ROOT.
          ) else (
            echo ERROR: Neither server.exe nor runtime.exe found
            dir build\runtime
            exit /b 1
          )

          if exist _sudo-studio-source\resources\icon.ico (
            if not exist build\SudoStudio\resources mkdir build\SudoStudio\resources
            copy _sudo-studio-source\resources\icon.ico build\SudoStudio\resources\icon.ico /Y
            echo icon.ico copied for installer shortcuts.
          ) else (
            echo ERROR: icon.ico not found in Sudo-studio resources
            exit /b 1
          )
          if exist _sudo-studio-source\resources\wizard-small.bmp (
            copy _sudo-studio-source\resources\wizard-small.bmp build\SudoStudio\resources\wizard-small.bmp /Y
            copy _sudo-studio-source\resources\installer-banner.bmp build\SudoStudio\resources\installer-banner.bmp /Y
            echo Installer wizard bitmaps copied.
          ) else (
            echo INFO: No wizard bitmaps found - installer will use default wizard images.
          )

      # -- 12. Copy extension a RACINE\extensions\sudo-ai -----------------------
      - name: Copy extension to ROOT\extensions\sudo-ai
        shell: cmd
        run: |
          if exist sudo-ai-extension (
            xcopy sudo-ai-extension build\SudoStudio\extensions\sudo-ai /E /I /Y /Q
            echo Extension copied to ROOT\extensions\sudo-ai.
          ) else (
            echo ERROR: sudo-ai-extension directory not found
            exit /b 1
          )

      # -- 13. Copy start.bat from Sudo-studio repo -----------------------------
      - name: Copy start.bat from Sudo-studio repo
        shell: cmd
        run: |
          if exist _sudo-studio-source\start.bat (
            copy _sudo-studio-source\start.bat build\SudoStudio\start.bat /Y
            echo start.bat copied from Sudo-studio repo.
          ) else (
            echo ERROR: start.bat not found in Sudo-studio repo
            dir _sudo-studio-source
            exit /b 1
          )

      # -- 14. Create README.txt ------------------------------------------------
      - name: Create README.txt
        shell: powershell
        run: |
          $lines = @(
            'SUDO STUDIO',
            '===========',
            '',
            'How to start:',
            '1. Double-click start.bat',
            '2. Wait for services to launch (up to 30 seconds each)',
            '3. Sudo Studio opens automatically with the Sudo AI extension',
            '',
            'Structure:',
            '- backend.exe   : API server port 5000',
            '- runtime.exe   : AI server port 6000',
            '- SudoStudio.exe : Code editor (Sudo Studio)',
            '- extensions\   : Sudo AI extension',
            '- data\         : Database',
            '- logs\         : Log files'
          )
          $lines | Out-File -FilePath "build\SudoStudio\README.txt" -Encoding UTF8
          Write-Host "README.txt created."

      # -- 15. Validate build structure -----------------------------------------
      - name: Validate build structure
        shell: cmd
        run: |
          echo === VALIDATION STRUCTURE SYNCHRONISEE AVEC start.bat v4.1 ===
          dir build\SudoStudio /s /b
          echo ==============================================================

          if not exist build\SudoStudio\start.bat (
            echo ERROR: start.bat manquant a la RACINE
            exit /b 1
          )
          echo OK: start.bat a la RACINE

          if not exist build\SudoStudio\backend.exe (
            echo ERROR: backend.exe manquant a la RACINE
            exit /b 1
          )
          echo OK: backend.exe a la RACINE

          if not exist build\SudoStudio\runtime.exe (
            echo ERROR: runtime.exe manquant a la RACINE
            exit /b 1
          )
          echo OK: runtime.exe a la RACINE

          if not exist build\SudoStudio\SudoStudio.exe (
            echo ERROR: SudoStudio.exe manquant a la RACINE
            exit /b 1
          )
          echo OK: SudoStudio.exe a la RACINE

          if not exist "build\SudoStudio\extensions\sudo-ai\extension.js" (
            echo ERROR: extension sudo-ai manquante
            exit /b 1
          )
          echo OK: extensions\sudo-ai presente

          echo === TOUT EST EN PLACE - SYNCHRONISE AVEC start.bat v4.1 ===

      # -- 16. Install Inno Setup -----------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # -- 17. Create installer.iss ---------------------------------------------
      - name: Create installer.iss
        shell: powershell
        run: |
          $lines = @(
            '[Setup]',
            'AppName=SudoStudio',
            'AppVersion=1.0.0',
            'AppPublisher=SudoStudio',
            'AppPublisherURL=https://github.com/juleszackaria-lab/Sudo-studio',
            'DefaultDirName={autopf}\SudoStudio',
            'DefaultGroupName=SudoStudio',
            'OutputDir=Output',
            'OutputBaseFilename=SudoStudio-Setup',
            'SetupIconFile=build\SudoStudio\resources\icon.ico',
            'UninstallDisplayIcon={app}\resources\icon.ico',
            'VersionInfoVersion=1.0.0',
            'VersionInfoCompany=SudoStudio',
            'VersionInfoDescription=Sudo Studio Installer',
            'VersionInfoProductName=Sudo Studio',
            'Compression=lzma',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'DisableProgramGroupPage=yes',
            'PrivilegesRequired=admin',
            'PrivilegesRequiredOverridesAllowed=dialog',
            '',
            '[Languages]',
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"',
            '',
            '[Files]',
            'Source: "build\SudoStudio\*"; DestDir: "{app}"; Flags: recursesubdirs',
            '',
            '[Icons]',
            'Name: "{group}\SudoStudio"; Filename: "{app}\start.bat"; WorkingDir: "{app}"; IconFilename: "{app}\resources\icon.ico"',
            'Name: "{userdesktop}\SudoStudio"; Filename: "{app}\start.bat"; WorkingDir: "{app}"; Tasks: desktopicon; IconFilename: "{app}\resources\icon.ico"',
            '',
            '[Run]',
            'Filename: "{app}\start.bat"; WorkingDir: "{app}"; Description: "Launch SudoStudio"; Flags: postinstall nowait skipifsilent'
          )
          $bmpSmall = "build\SudoStudio\resources\wizard-small.bmp"
          $bmpBanner = "build\SudoStudio\resources\installer-banner.bmp"
          if ((Test-Path $bmpSmall) -and (Test-Path $bmpBanner)) {
            $idx = [array]::IndexOf($lines, 'WizardStyle=modern')
            if ($idx -lt 0) { Write-Warning 'WizardStyle line not found - skipping wizard bitmaps.' }
            else {
            $before = $lines[0..$idx]
            $after = $lines[($idx+1)..($lines.Count-1)]
            $lines = @($before; "WizardSmallImageFile=$bmpSmall"; "WizardImageFile=$bmpBanner"; $after)
            Write-Host "Wizard bitmaps wired into installer.iss."
            }
          } else {
            Write-Warning "Wizard bitmaps missing - installer will use default wizard images."
          }
          $lines | Out-File -FilePath "installer.iss" -Encoding ASCII
          Write-Host "installer.iss created."
          Get-Content "installer.iss"

      # -- 18. Build installer --------------------------------------------------
      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if errorlevel 1 (
            echo ERROR: ISCC failed - no installer produced
            exit /b 1
          )
          echo Installer built.
          dir Output

      # -- 19. Verify installer -------------------------------------------------
      - name: Verify installer binary
        shell: powershell
        run: |
          $setup = Get-ChildItem "Output\*.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Error "Installer EXE not found in Output\"
            exit 1
          }
          $sizeMB = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "Installer: $($setup.Name) -- $sizeMB MB"
          if ($setup.Length -lt 5MB) {
            Write-Warning "Installer looks too small ($sizeMB MB). May be incomplete."
          }

      # -- 20. Upload installer artifact ----------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudoStudio-Installer
          path: Output\SudoStudio-Setup.exe
          retention-days: 30

      # -- 21. Create portable zip ----------------------------------------------
      - name: Create portable zip
        shell: powershell
        run: |
          Compress-Archive -Path "build\SudoStudio\*" -DestinationPath "Output\SudoStudio-Portable.zip" -Force
          $sizeMB = [math]::Round((Get-Item "Output\SudoStudio-Portable.zip").Length / 1MB, 1)
          Write-Host "Portable zip created: $sizeMB MB"

      # -- 22. Upload portable zip artifact -------------------------------------
      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudoStudio-Portable
          path: Output\SudoStudio-Portable.zip
          retention-days: 30
