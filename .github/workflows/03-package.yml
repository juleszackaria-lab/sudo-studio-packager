name: SudoStudio Stable Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  BACKEND_RUN_ID: "40792718190"
  RUNTIME_RUN_ID: "40792720757"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read

    steps:
      # -- 1. Checkout this repo ------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      # -- 1b. Checkout Sudo-studio repo ----------------------------------------
      - name: Checkout sudo-ai-extension from Sudo-studio
        uses: actions/checkout@v4
        with:
          repository: juleszackaria-lab/Sudo-studio
          path: _sudo-studio-source
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      # -- 1c. Guard against stale runtime artifact (P33-a) ------------------------
      # Refuses a runtime-exe older than the last backend/runtime touch.
      # Needs the full-history checkout above (fetch-depth: 0).
      - name: Guard against stale runtime artifact (P33-a)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "_sudo-studio-source\scripts\ci\check-runtime-fresh.ps1" -RunId $env:RUNTIME_RUN_ID -SourceDir _sudo-studio-source
          if ($LASTEXITCODE -ne 0) { Write-Error 'stale runtime artifact gate failed'; exit 1 }

      # -- 2. Copy sudo-ai-extension --------------------------------------------
      - name: Copy sudo-ai-extension into workspace
        shell: cmd
        run: |
          if exist _sudo-studio-source\sudo-ai-extension (
            xcopy _sudo-studio-source\sudo-ai-extension sudo-ai-extension /E /I /Y /Q
            echo sudo-ai-extension copied from Sudo-studio repo.
          ) else (
            echo ERROR: sudo-ai-extension not found in Sudo-studio repo
            dir _sudo-studio-source
            exit /b 1
          )

      # -- 3. Download backend.exe ----------------------------------------------
      - name: Download backend.exe (by run ID)
        uses: dawidd6/action-download-artifact@v5
        with:
          repo: juleszackaria-lab/Sudo-studio
          run_id: ${{ env.BACKEND_RUN_ID }}
          name: backend-exe
          path: build/backend
          if_no_artifact_found: warn

      # -- 4. Download runtime.exe ----------------------------------------------
      - name: Download runtime.exe (by run ID)
        uses: dawidd6/action-download-artifact@v5
        with:
          repo: juleszackaria-lab/Sudo-studio
          run_id: ${{ env.RUNTIME_RUN_ID }}
          name: runtime-exe
          path: build/runtime
          if_no_artifact_found: warn

      # -- 4b. Freshness gate: pins must match Sudo-studio@main --------------------
      # BACKEND_RUN_ID / RUNTIME_RUN_ID are manual pins (see env above). Without
      # this gate, 03 would silently ship backend.exe/runtime.exe built from an
      # OLD main (missing recent fixes). The gate FAILS when a pin is stale;
      # fix = run workflows 01 + 02, then bump the pin to the new run ID.
      - name: Verify artifacts are built from current main
        shell: powershell
        run: |
          $repo = "juleszackaria-lab/Sudo-studio"
          $headers = @{ Authorization = "Bearer ${{ secrets.PAT }}"; Accept = "application/vnd.github+json" }
          $mainSha = (Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/commits/main" -Headers $headers).sha
          Write-Host "[INFO] Sudo-studio main = $mainSha"
          $stale = $false
          foreach ($pair in @(@("BACKEND", $env:BACKEND_RUN_ID), @("RUNTIME", $env:RUNTIME_RUN_ID))) {
            $run = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$($pair[1])" -Headers $headers
            Write-Host ("[INFO] {0}_RUN_ID={1} head_sha={2} conclusion={3}" -f $pair[0], $pair[1], $run.head_sha, $run.conclusion)
            if ($run.conclusion -ne "success") {
              Write-Error ("[FAIL] run {0} conclusion is '{1}' -- re-run workflow 01/02 first" -f $pair[1], $run.conclusion)
              $stale = $true
            } elseif ($run.head_sha -ne $mainSha) {
              Write-Error ("[FAIL] {0}_RUN_ID={1} was built from {2}, but main is {3} -- re-run workflows 01+02, then bump the pin" -f $pair[0], $pair[1], $run.head_sha, $mainSha)
              $stale = $true
            }
          }
          if ($stale) { exit 1 }
          Write-Host "[OK] Both artifacts are built from current main."

      # -- 5. Validate artifact binaries ----------------------------------------
      - name: Validate artifact binaries
        shell: powershell
        run: |
          $backendPath = "build\backend\backend.exe"
          $runtimePath = "build\runtime\server.exe"
          $MIN_SIZE_BYTES = 500000

          function Assert-Binary($p, $name) {
            if (-not (Test-Path $p)) {
              Write-Error "$name NOT FOUND at $p. Run workflow 01 / 02 first."
              exit 1
            }
            $size = (Get-Item $p).Length
            if ($size -lt $MIN_SIZE_BYTES) {
              Write-Error "$name is only $size bytes -- looks like a placeholder."
              exit 1
            }
            Write-Host "OK: $name ($([math]::Round($size/1MB,1)) MB)"
          }

          Assert-Binary $backendPath "backend.exe"
          Assert-Binary $runtimePath "runtime.exe (server.exe)"

      # -- 6. Setup Node.js -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # P46: panel-render-test needs global WebSocket (21+)

      # -- 7. Install extension dependencies ------------------------------------
      - name: Install extension node_modules
        shell: cmd
        run: |
          cd sudo-ai-extension
          npm install --production
          echo Extension node_modules installed.

      # -- 8. Prepare build folders ---------------------------------------------
      - name: Prepare build folders
        shell: cmd
        run: |
          if not exist build mkdir build
          if not exist build\SudoStudio mkdir build\SudoStudio
          if not exist build\SudoStudio\extensions mkdir build\SudoStudio\extensions
          if not exist Output mkdir Output
          echo Folders created - structure synchronisee avec start.bat v4.1

      # -- 9. Download VSCodium portable ----------------------------------------
      - name: Download VSCodium portable
        shell: powershell
        run: |
          $ver = "1.97.2.25045"
          $url = "https://github.com/VSCodium/vscodium/releases/download/$ver/VSCodium-win32-x64-$ver.zip"
          Write-Host "Downloading VSCodium $ver..."
          Invoke-WebRequest $url -OutFile vscodium.zip -TimeoutSec 300
          Write-Host "VSCodium downloaded: $([math]::Round((Get-Item vscodium.zip).Length/1MB,1)) MB"

      # -- 10. Extract VSCodium a la RACINE -------------------------------------
      - name: Extract VSCodium to ROOT
        shell: powershell
        run: |
          Expand-Archive vscodium.zip build\SudoStudio -Force
          Write-Host "VSCodium extracted to ROOT."
          if (-not (Test-Path "build\SudoStudio\VSCodium.exe")) {
            Write-Error "VSCodium.exe not found at ROOT after extraction!"
            exit 1
          }
          Write-Host "VSCodium.exe confirmed at ROOT."

      # -- 10a. Provide valid logo.ico for branding ------------------------------
      # The branding script needs a REAL multi-resolution ICO. Sudo-studio's
      # resources\icon.ico is verified valid (6 sizes, 41KB) -- never a PNG
      # renamed to .ico (that broken approach was removed from step 11).
      - name: Provide valid logo.ico
        shell: powershell
        run: |
          $src = "_sudo-studio-source\resources\icon.ico"
          $dst = "build\SudoStudio\logo.ico"
          if (-not (Test-Path $src)) {
            Write-Error "[FAIL] Valid ICO source missing at $src -- cannot brand icons"
            exit 1
          }
          Copy-Item $src $dst -Force
          $magic = [System.IO.File]::ReadAllBytes($dst)[0..3]
          if (!($magic[0] -eq 0x00 -and $magic[1] -eq 0x00 -and $magic[2] -eq 0x01 -and $magic[3] -eq 0x00)) {
            Write-Error "[FAIL] $dst is NOT a valid ICO file (bad magic bytes)"
            exit 1
          }
          Write-Host "[OK] logo.ico ready: $([math]::Round((Get-Item $dst).Length/1KB,1)) KB, real ICO format"

      # -- 10b. Customize VSCodium branding to Sudo Studio ----------------------
      - name: Customize VSCodium branding
        shell: powershell
        run: |
          $scriptPath = "_sudo-studio-source\scripts\customize-vscodium.ps1"
          if (Test-Path $scriptPath) {
            $ssCommit10 = (git -C _sudo-studio-source rev-parse HEAD).Trim()
            & $scriptPath -VSCodiumDir "build\SudoStudio" -SudoStudioCommit $ssCommit10
            Write-Host "VSCodium customized to Sudo Studio branding."
          } else {
            Write-Error "customize-vscodium.ps1 not found - refusing to ship an unbranded build."
            exit 1
          }

      # -- 10c. Patch exe icon + version strings with rcedit --------------------
      # This sets the taskbar / window-corner / Alt+Tab icon. Without it the app
      # keeps the stock VSCodium icon even if everything else is branded.
      - name: Patch exe icon with rcedit
        shell: powershell
        run: |
          # Standalone rcedit exe: 'npm install -g rcedit' succeeds but its bin dir
          # is NOT on PATH on windows runners -> 'rcedit not recognized'.
          # v2.0.0 is the same engine the (deprecated) npm package wraps.
          $rcExe = "build\rcedit-x64.exe"
          if (-not (Test-Path $rcExe)) {
            Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $rcExe -TimeoutSec 120 -UseBasicParsing
          }
          if (-not (Test-Path $rcExe)) {
            Write-Error "[FAIL] rcedit-x64.exe download failed"
            exit 1
          }
          $rcSize = (Get-Item $rcExe).Length
          if ($rcSize -lt 500000) {
            Write-Error "[FAIL] rcedit-x64.exe too small ($rcSize bytes) - bad download"
            exit 1
          }
          Write-Host "[OK] rcedit ready: $([math]::Round($rcSize/1KB,1)) KB standalone"
          $exe = "build\SudoStudio\VSCodium.exe"
          $ico = "build\SudoStudio\logo.ico"
          if (-not (Test-Path $exe)) {
            Write-Error "[FAIL] $exe not found -- cannot patch executable icon"
            exit 1
          }
          if (-not (Test-Path $ico)) {
            Write-Error "[FAIL] $ico not found -- cannot patch executable icon"
            exit 1
          }
          & $rcExe $exe --set-icon $ico
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] rcedit --set-icon failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "[OK] rcedit: icon patched from $ico"
          & $rcExe $exe --set-version-string "ProductName"    "Sudo Studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit ProductName failed"; exit 1 }
          & $rcExe $exe --set-version-string "FileDescription" "Sudo Studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit FileDescription failed"; exit 1 }
          & $rcExe $exe --set-version-string "CompanyName"    "Sudo Studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit CompanyName failed"; exit 1 }
          & $rcExe $exe --set-version-string "InternalName"   "sudo-studio"
          if ($LASTEXITCODE -ne 0) { Write-Error "[FAIL] rcedit InternalName failed"; exit 1 }
          Write-Host "[OK] rcedit: version strings patched"

      # -- 10d. Rename VSCodium.exe -> SudoStudio.exe -----------------------------
      # start.bat (v4.1+) already prefers SudoStudio.exe with VSCodium.exe
      # fallback, so the rename is safe. The tile manifest was already renamed
      # by the branding script (STEP 4e) to match.
      - name: Rename exe to SudoStudio.exe
        shell: powershell
        run: |
          $from = "build\SudoStudio\VSCodium.exe"
          $to = "build\SudoStudio\SudoStudio.exe"
          if (-not (Test-Path $from)) {
            Write-Error "[FAIL] $from not found -- cannot rename"
            exit 1
          }
          Move-Item $from $to -Force
          Write-Host "[OK] Renamed VSCodium.exe -> SudoStudio.exe"

      # -- 10e. Verify exe branding stuck -----------------------------------------
      - name: Verify SudoStudio.exe branding
        shell: powershell
        run: |
          $exe = "build\SudoStudio\SudoStudio.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "[FAIL] $exe not found after rename"
            exit 1
          }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "[VERIFY] ProductName: $($vi.ProductName) | FileDescription: $($vi.FileDescription) | Company: $($vi.CompanyName)"
          if ($vi.ProductName -ne "Sudo Studio") { Write-Error "[FAIL] ProductName not patched"; exit 1 }
          if ($vi.FileDescription -ne "Sudo Studio") { Write-Error "[FAIL] FileDescription not patched"; exit 1 }
          if ($vi.CompanyName -ne "Sudo Studio") { Write-Error "[FAIL] CompanyName not patched"; exit 1 }
          Write-Host "[OK] SudoStudio.exe branding verified"

      # -- 10f. Pack-time exe-icon byte gate (P32-P4) ------------------------------
      # Step 10e checks version STRINGS only; this checks the icon BYTES
      # (old VSCodium 256x256 PNG gone, new Sudo PNG present).
      - name: Verify exe icon bytes (P32-P4)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File _sudo-studio-source\scripts\ci\check-exe-icon.ps1 -ExePath build\SudoStudio\SudoStudio.exe
          if ($LASTEXITCODE -ne 0) { Write-Error 'exe icon gate failed'; exit 1 }

      # -- 11. Copy executables a la RACINE -------------------------------------
      - name: Copy executables to ROOT
        shell: cmd
        run: |
          copy build\backend\backend.exe build\SudoStudio\backend.exe /Y
          echo backend.exe copied to ROOT.

          if exist build\runtime\server.exe (
            copy build\runtime\server.exe build\SudoStudio\runtime.exe /Y
            echo runtime.exe copied from server.exe to ROOT.
          ) else if exist build\runtime\runtime.exe (
            copy build\runtime\runtime.exe build\SudoStudio\runtime.exe /Y
            echo runtime.exe copied to ROOT.
          ) else (
            echo ERROR: Neither server.exe nor runtime.exe found
            dir build\runtime
            exit /b 1
          )

          if exist _sudo-studio-source\resources\icon.ico (
            if not exist build\SudoStudio\resources mkdir build\SudoStudio\resources
            copy _sudo-studio-source\resources\icon.ico build\SudoStudio\resources\icon.ico /Y
            echo icon.ico copied for installer shortcuts.
          ) else (
            echo ERROR: icon.ico not found in Sudo-studio resources
            exit /b 1
          )
          if exist _sudo-studio-source\resources\sudo-icon.svg (
            copy _sudo-studio-source\resources\sudo-icon.svg build\SudoStudio\resources\sudo-icon.svg /Y
            echo sudo-icon.svg copied for brand gate P20-P29c4.
          ) else (
            echo ERROR: sudo-icon.svg not found in Sudo-studio resources
            exit /b 1
          )
          if exist _sudo-studio-source\resources\wizard-small.bmp (
            copy _sudo-studio-source\resources\wizard-small.bmp build\SudoStudio\resources\wizard-small.bmp /Y
            copy _sudo-studio-source\resources\installer-banner.bmp build\SudoStudio\resources\installer-banner.bmp /Y
            echo Installer wizard bitmaps copied.
          ) else (
            echo INFO: No wizard bitmaps found - installer will use default wizard images.
          )

      # -- 12. Copy extension a RACINE\extensions\sudo-ai -----------------------
      - name: Copy extension to ROOT\extensions\sudo-ai
        shell: cmd
        run: |
          if exist sudo-ai-extension (
            xcopy sudo-ai-extension build\SudoStudio\extensions\sudo-ai /E /I /Y /Q
            echo Extension copied to ROOT\extensions\sudo-ai.
          ) else (
            echo ERROR: sudo-ai-extension directory not found
            exit /b 1
          )

      # -- 12b REMOVED (P27): the OpenCode fetch step is deleted.
      # Manifest, binary and driver were removed from Sudo-studio in P27;
      # the agent now runs from sudo-agent/src (see step 12c, no binary).

      # -- 12c. Copy sudo-agent server code a RACINE\sudo-agent -----------------
      # MINI node: the extension spawns sudo-agent/src/server.js with the product
      # .exe itself (ELECTRON_RUN_AS_NODE=1). Layout: defaultServerJs() resolves
      # <install>\sudo-agent\src\server.js from the extension folder, so the
      # code goes to ROOT\sudo-agent (sibling of extensions\). No PC Node.js,
      # no second Node bundled. FAILS if missing: refusing to ship a dead agent.
      - name: Copy sudo-agent to ROOT\sudo-agent
        shell: powershell
        run: |
          $src = "_sudo-studio-source\sudo-agent\src"
          $dst = "build\SudoStudio\sudo-agent\src"
          if (-not (Test-Path $src)) {
            Write-Error "[FAIL] $src not found in Sudo-studio repo -- agent would not start"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force
          $n = (Get-ChildItem $dst -Recurse -File).Count
          $bytes = (Get-ChildItem $dst -Recurse -File | Measure-Object Length -Sum).Sum
          if (-not (Test-Path "$dst\server.js")) {
            Write-Error "[FAIL] server.js missing after copy -- agent would not start"
            exit 1
          }
          Write-Host ("[OK] sudo-agent copied: {0} files, {1:N0} bytes" -f $n, $bytes)

      # -- 12d. Validate shipped extension container (P32-P1, validation only) ----
      # Step 12 already copies the FRESH tree (Sudo-studio@main + npm
      # install); only the [EXT-SHIP] container check runs here. No re-copy:
      # the source tree has no node_modules, re-copying would ship a dead
      # extension.
      - name: Validate shipped extension container (P32-P1)
        shell: powershell
        run: |
          $extDst = 'build\SudoStudio\extensions\sudo-ai'
          $pkg = Get-Content "$extDst\package.json" -Raw | ConvertFrom-Json
          $bar = @($pkg.contributes.viewsContainers.activitybar)
          if ($bar.Count -ne 1 -or $bar[0].id -ne 'sudo-studio') { Write-Error '[EXT-SHIP] FAIL: no single sudo-studio activity container'; exit 1 }
          Write-Host ("[EXT-SHIP] container: {0}" -f ($bar | ConvertTo-Json -Compress -Depth 5))
          Write-Host ("[EXT-SHIP] views in sudo-studio: {0}, explorer views: {1}" -f @($pkg.contributes.views.'sudo-studio').Count, ($null -ne $pkg.contributes.views.explorer))

      # -- 13. Copy start.bat from Sudo-studio repo -----------------------------
      - name: Copy start.bat from Sudo-studio repo
        shell: cmd
        run: |
          if exist _sudo-studio-source\start.bat (
            copy _sudo-studio-source\start.bat build\SudoStudio\start.bat /Y
            echo start.bat copied from Sudo-studio repo.
          ) else (
            echo ERROR: start.bat not found in Sudo-studio repo
            dir _sudo-studio-source
            exit /b 1
          )

      # -- 13b. Copy launch_hidden.vbs + verify-installed.ps1 (P35-d/P36-d) -----
      - name: Copy launch files to ROOT
        shell: cmd
        run: |
          if exist _sudo-studio-source\launch_hidden.vbs (
            copy _sudo-studio-source\launch_hidden.vbs build\SudoStudio\launch_hidden.vbs /Y
            echo launch_hidden.vbs copied to ROOT.
          ) else (
            echo ERROR: launch_hidden.vbs not found in Sudo-studio repo
            exit /b 1
          )
          if exist _sudo-studio-source\scripts\verify\verify-installed.ps1 (
            copy _sudo-studio-source\scripts\verify\verify-installed.ps1 build\SudoStudio\verify-installed.ps1 /Y
            echo verify-installed.ps1 copied to ROOT.
          ) else (
            echo ERROR: verify-installed.ps1 not found in Sudo-studio repo
            exit /b 1
          )

      # -- 14. Create README.txt ------------------------------------------------
      - name: Create README.txt
        shell: powershell
        run: |
          $lines = @(
            'SUDO STUDIO',
            '===========',
            '',
            'How to start:',
            '1. Double-click start.bat',
            '2. Wait for services to launch (up to 30 seconds each)',
            '3. Sudo Studio opens automatically with the Sudo AI extension',
            '',
            'Structure:',
            '- backend.exe   : API server port 5000',
            '- runtime.exe   : AI server port 6000',
            '- SudoStudio.exe : Code editor (Sudo Studio)',
            '- extensions\   : Sudo AI extension',
            '- data\         : Database',
            '- logs\         : Log files'
          )
          $lines | Out-File -FilePath "build\SudoStudio\README.txt" -Encoding UTF8
          Write-Host "README.txt created."

      # -- 15. Validate build structure -----------------------------------------
      - name: Validate build structure
        shell: cmd
        run: |
          echo === VALIDATION STRUCTURE SYNCHRONISEE AVEC start.bat v4.1 ===
          dir build\SudoStudio /s /b
          echo ==============================================================

          if not exist build\SudoStudio\start.bat (
            echo ERROR: start.bat manquant a la RACINE
            exit /b 1
          )
          echo OK: start.bat a la RACINE

          if not exist build\SudoStudio\backend.exe (
            echo ERROR: backend.exe manquant a la RACINE
            exit /b 1
          )
          echo OK: backend.exe a la RACINE

          if not exist build\SudoStudio\runtime.exe (
            echo ERROR: runtime.exe manquant a la RACINE
            exit /b 1
          )
          echo OK: runtime.exe a la RACINE

          if not exist build\SudoStudio\SudoStudio.exe (
            echo ERROR: SudoStudio.exe manquant a la RACINE
            exit /b 1
          )
          echo OK: SudoStudio.exe a la RACINE

          if not exist "build\SudoStudio\extensions\sudo-ai\extension.js" (
            echo ERROR: extension sudo-ai manquante
            exit /b 1
          )
          echo OK: extensions\sudo-ai presente

          if not exist "build\SudoStudio\sudo-agent\src\server.js" (
            echo ERROR: sudo-agent\src\server.js manquant a la RACINE
            exit /b 1
          )
          echo OK: sudo-agent\src\server.js present

          if not exist build\SudoStudio\launch_hidden.vbs (
            echo ERROR: launch_hidden.vbs manquant a la RACINE
            exit /b 1
          )
          echo OK: launch_hidden.vbs a la RACINE

          if not exist build\SudoStudio\verify-installed.ps1 (
            echo ERROR: verify-installed.ps1 manquant a la RACINE
            exit /b 1
          )
          echo OK: verify-installed.ps1 a la RACINE

          echo === TOUT EST EN PLACE - SYNCHRONISE AVEC start.bat v4.1 ===

      # -- 16. Install Inno Setup -----------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # -- 16b. Component manifest + refusal + brand gate (P29c4-P1) --------------
      # AFTER the last step writing build\SudoStudio (15 validates, 16
      # installs Inno outside it), BEFORE installer.iss (step 17).
      - name: Build component manifest (P29c4)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          $ssCommit = (git -C _sudo-studio-source rev-parse HEAD).Trim()
          Write-Host "[MANIFEST] Sudo-studio checkout = $ssCommit"
          powershell -NoProfile -ExecutionPolicy Bypass -File _sudo-studio-source\scripts\ci\build-manifest.ps1 -BuildDir build\SudoStudio -SourceDir _sudo-studio-source -SudoStudioCommit $ssCommit -BackendRunId $env:BACKEND_RUN_ID -RuntimeRunId $env:RUNTIME_RUN_ID
          if ($LASTEXITCODE -ne 0) { Write-Error 'manifest/refusal gate failed'; exit 1 }

      # -- 17. Create installer.iss ---------------------------------------------
      - name: Create installer.iss
        shell: powershell
        run: |
          $lines = @(
            '[Setup]',
            'AppName=SudoStudio',
            'AppVersion=1.0.0',
            'AppPublisher=SudoStudio',
            'AppPublisherURL=https://github.com/juleszackaria-lab/Sudo-studio',
            'DefaultDirName={localappdata}\Programs\SudoStudio',
            'DefaultGroupName=Sudo Studio',
            'OutputDir=Output',
            'OutputBaseFilename=SudoStudio-Setup',
            'SetupIconFile=build\SudoStudio\resources\icon.ico',
            'UninstallDisplayIcon={app}\resources\icon.ico',
            'VersionInfoVersion=1.0.0',
            'VersionInfoCompany=SudoStudio',
            'VersionInfoDescription=Sudo Studio Installer',
            'VersionInfoProductName=Sudo Studio',
            'Compression=lzma',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'DisableProgramGroupPage=yes',
            'PrivilegesRequired=lowest',
            '',
            '[Languages]',
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"',
            '',
            '[Files]',
            'Source: "build\SudoStudio\*"; DestDir: "{app}"; Flags: recursesubdirs',
            '',
            '[InstallDelete]',
            'Type: filesandordirs; Name: "{app}\extensions\sudo-ai"',
            'Type: filesandordirs; Name: "{app}\sudo-ai-extension"',
            'Type: filesandordirs; Name: "{app}\data\extensions\*sudo*"',
            'Type: filesandordirs; Name: "{app}\resources\app\extensions\*sudo*"',
            'Type: files; Name: "{app}\VSCodium.exe"',
            'Type: files; Name: "{app}\VSCodium.VisualElementsManifest.xml"',
            'Type: files; Name: "{app}\code.ico"',
            'Type: files; Name: "{app}\resources\win32\code.ico"',
            'Type: files; Name: "{app}\resources\win32\code_150x150.png"',
            'Type: files; Name: "{app}\resources\win32\code_70x70.png"',
            '',
            '[Icons]',
            'Name: "{group}\Sudo Studio"; Filename: "wscript.exe"; Parameters: """{app}\launch_hidden.vbs"" ""{app}\start.bat"""; WorkingDir: "{app}"; IconFilename: "{app}\resources\icon.ico"',
            'Name: "{userdesktop}\Sudo Studio"; Filename: "wscript.exe"; Parameters: """{app}\launch_hidden.vbs"" ""{app}\start.bat"""; WorkingDir: "{app}"; Tasks: desktopicon; IconFilename: "{app}\resources\icon.ico"',
            '',
            '[Run]',
            'Filename: "wscript.exe"; Parameters: """{app}\launch_hidden.vbs"" ""{app}\start.bat"""; WorkingDir: "{app}"; Description: "Launch Sudo Studio"; Flags: postinstall nowait skipifsilent'
          )
          $bmpSmall = "build\SudoStudio\resources\wizard-small.bmp"
          $bmpBanner = "build\SudoStudio\resources\installer-banner.bmp"
          if ((Test-Path $bmpSmall) -and (Test-Path $bmpBanner)) {
            $idx = [array]::IndexOf($lines, 'WizardStyle=modern')
            if ($idx -lt 0) { Write-Warning 'WizardStyle line not found - skipping wizard bitmaps.' }
            else {
            $before = $lines[0..$idx]
            $after = $lines[($idx+1)..($lines.Count-1)]
            $lines = @($before; "WizardSmallImageFile=$bmpSmall"; "WizardImageFile=$bmpBanner"; $after)
            Write-Host "Wizard bitmaps wired into installer.iss."
            }
          } else {
            Write-Warning "Wizard bitmaps missing - installer will use default wizard images."
          }
          $lines | Out-File -FilePath "installer.iss" -Encoding ASCII
          Write-Host "installer.iss created."
          Get-Content "installer.iss"

      # -- 18. Build installer --------------------------------------------------
      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if errorlevel 1 (
            echo ERROR: ISCC failed - no installer produced
            exit /b 1
          )
          echo Installer built.
          dir Output

      # -- 19. Verify installer -------------------------------------------------
      - name: Verify installer binary
        shell: powershell
        run: |
          $setup = Get-ChildItem "Output\*.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Error "Installer EXE not found in Output\"
            exit 1
          }
          $sizeMB = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "Installer: $($setup.Name) -- $sizeMB MB"
          if ($setup.Length -lt 5MB) {
            Write-Warning "Installer looks too small ($sizeMB MB). May be incomplete."
          }

      # -- 19a. CI enterprise license so the gate renders gated panels ----
      # (mirror of the panel-windows job step: devops/security/duplication/
      # central call licCore.guardFeature and open nothing without it).
      - name: Install CI enterprise license (gated panels)
        shell: powershell
        env:
          LICENSE_CI_KEY: ${{ secrets.LICENSE_CI_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_CI_KEY)) { throw 'LICENSE_CI_KEY secret missing (repo Settings > Secrets > Actions)' }
          $licDir = Join-Path $env:USERPROFILE '.sudo_studio'
          New-Item -ItemType Directory -Force -Path $licDir | Out-Null
          @{ key = $env:LICENSE_CI_KEY.Trim() } | ConvertTo-Json -Compress | Set-Content (Join-Path $licDir 'license.json') -Encoding ascii
          $env:SUDO_STUDIO_HOME = $env:USERPROFILE
          node -e "const lic=require('./_sudo-studio-source/sudo-ai-extension/src/license/license');const s=lic.getStatus({});console.log('license state='+s.state+' edition='+s.edition);if(s.state!=='active'||['team','enterprise'].indexOf(s.edition)===-1){console.error('license reason: '+s.reason);process.exit(1)}"
          if ($LASTEXITCODE -ne 0) { throw 'CI license invalid (see log)' }

      # -- 19b. P46 delivery gate (BLOCKS publish on any failure) ------
      - name: P46 delivery gate (install + test installed product)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "_sudo-studio-source\\scripts\\verify\\p46-gate.ps1" -InstallerPath "Output\\SudoStudio-Setup.exe" -SourceDir "_sudo-studio-source" -OutDir "gate-out"
          if ($LASTEXITCODE -ne 0) { Write-Error 'P46 gate FAILED - publish blocked'; exit 1 }
      - name: Upload gate diagnostics (publish blocked)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: gate-out/
          retention-days: 30
          if-no-files-found: warn

      # -- 20. Upload installer artifact ----------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudoStudio-Installer
          path: Output\SudoStudio-Setup.exe
          retention-days: 30

      # -- 21. Create portable zip ----------------------------------------------
      - name: Create portable zip
        shell: powershell
        run: |
          Compress-Archive -Path "build\SudoStudio\*" -DestinationPath "Output\SudoStudio-Portable.zip" -Force
          $sizeMB = [math]::Round((Get-Item "Output\SudoStudio-Portable.zip").Length / 1MB, 1)
          Write-Host "Portable zip created: $sizeMB MB"

      # -- 22. Upload portable zip artifact -------------------------------------
      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudoStudio-Portable
          path: Output\SudoStudio-Portable.zip
          retention-days: 30

  smoke-windows:
    name: P29+P31 smoke (Windows install + agent e2e)
    runs-on: windows-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - name: Download installer
        uses: dawidd6/action-download-artifact@v5
        with:
          run_id: ${{ github.run_id }}
          name: SudoStudio-Installer
          path: smoke-dl
      - name: Check out Sudo-studio source (smoke scripts)
        uses: actions/checkout@v4
        with:
          repository: juleszackaria-lab/Sudo-studio
          ref: main
          path: _sudo-studio-source
      - name: Run installer smoke test (full)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File _sudo-studio-source\scripts\smoke\smoke-install.ps1 -InstallerPath (Join-Path (Get-Location) 'smoke-dl\SudoStudio-Setup.exe')
      - name: Setup Node.js (agent e2e)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run agent e2e on the installed product (P31-d)
        shell: powershell
        run: |
          node _sudo-studio-source\scripts\smoke\agent-e2e.js --installer (Join-Path (Get-Location) 'smoke-dl\SudoStudio-Setup.exe') --installDir (Join-Path $env:TEMP 'SudoE2E') --outDir e2e-out
      - name: Run P36 matrix gate on a fresh install
        shell: powershell
        run: |
          $mdir = Join-Path $env:TEMP 'SudoMatrix'
          if (Test-Path $mdir) { Remove-Item $mdir -Recurse -Force }
          $ip = Start-Process -FilePath (Join-Path (Get-Location) 'smoke-dl\SudoStudio-Setup.exe') -ArgumentList '/SILENT','/NORESTART',("/DIR=$mdir") -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw 'matrix reinstall failed' }
          node _sudo-studio-source\scripts\verify\run-matrix.js --install $mdir --smoke-log (Join-Path (Get-Location) 'smoke-out\summary.txt') --out matrix-result.json
          if ($LASTEXITCODE -ne 0) { throw 'P36 matrix gate FAILED (see matrix-result.json)' }
      - name: Uninstall matrix copy
        if: always()
        shell: powershell
        run: |
          $un = Join-Path $env:TEMP 'SudoMatrix\unins000.exe'
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/SILENT','/NORESTART' -Wait }
      - name: Upload smoke + e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke-out/
            e2e-out/
            matrix-result.json

  screenshot-windows:
    name: P32 screenshots (dark + light, best-effort)
    runs-on: windows-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Download installer
        uses: dawidd6/action-download-artifact@v5
        with:
          run_id: ${{ github.run_id }}
          name: SudoStudio-Installer
          path: shot-dl
      - name: Install + capture dark and light
        shell: powershell
        continue-on-error: true
        run: |
          $dir = Join-Path $env:TEMP 'SudoShot'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $ip = Start-Process -FilePath (Join-Path (Get-Location) 'shot-dl\SudoStudio-Setup.exe') -ArgumentList '/SILENT','/NORESTART',("/DIR=$dir") -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw 'install failed' }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $live = Join-Path $env:TEMP 'SudoShotLive'
          if (Test-Path $live) { Remove-Item $live -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $live | Out-Null
          Copy-Item (Join-Path $dir 'extensions\sudo-ai') (Join-Path $live 'sudo-ai') -Recurse -Force
          $udata = Join-Path $env:TEMP 'SudoShotUser'
          foreach ($theme in @('Default Dark Modern', 'Default Light Modern')) {
            if (Test-Path $udata) { Remove-Item $udata -Recurse -Force }
            $usr = Join-Path $udata 'User'; New-Item -ItemType Directory -Force -Path $usr | Out-Null
            "{`"window.title`":`"Sudo Studio - P32`",`"workbench.colorTheme`":`"$theme`",`"workbench.startupEditor`":`"none`"}" | Set-Content (Join-Path $usr 'settings.json') -Encoding UTF8
            $exe = Join-Path $dir 'SudoStudio.exe'
            $p = Start-Process -FilePath $exe -ArgumentList "--extensions-dir=`"$live`"","--user-data-dir=`"$udata`"",'--new-window','--disable-gpu' -PassThru
            try {
              Start-Sleep -Seconds 45
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $g.Dispose()
              $shot = 'shot-out\screenshot-' + ($theme -replace '[^A-Za-z]+', '-').ToLower() + '.png'
              New-Item -ItemType Directory -Force -Path 'shot-out' | Out-Null
              $bmp.Save((Join-Path (Get-Location) $shot), [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
              Write-Host ("[SHOT] saved {0}" -f $shot)
            } finally {
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
          }
      - name: Uninstall
        shell: powershell
        continue-on-error: true
        run: |
          $un = Join-Path $env:TEMP 'SudoShot\unins000.exe'
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/SILENT','/NORESTART' -Wait }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p32-screenshots
          path: shot-out/
          if-no-files-found: warn
  panel-windows:
    name: P35 panel render (15 panels, best-effort)
    runs-on: windows-latest
    needs: [build]
    timeout-minutes: 40
    continue-on-error: true  # user decision 19/10: runs + reports, never fails packaging
    steps:
      - name: Download installer
        uses: dawidd6/action-download-artifact@v5
        with:
          run_id: ${{ github.run_id }}
          name: SudoStudio-Installer
          path: panel-dl
      - name: Check out Sudo-studio source (panel script)
        uses: actions/checkout@v4
        with:
          repository: juleszackaria-lab/Sudo-studio
          ref: main
          path: _sudo-studio-source
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # panel-render needs global WebSocket (Node 21+)
      - name: Install CI enterprise license (gated panels)
        shell: powershell
        env:
          LICENSE_CI_KEY: ${{ secrets.LICENSE_CI_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_CI_KEY)) { throw 'LICENSE_CI_KEY secret missing (repo Settings > Secrets > Actions)' }
          $licDir = Join-Path $env:USERPROFILE '.sudo_studio'
          New-Item -ItemType Directory -Force -Path $licDir | Out-Null
          @{ key = $env:LICENSE_CI_KEY.Trim() } | ConvertTo-Json -Compress | Set-Content (Join-Path $licDir 'license.json') -Encoding ascii
          $env:SUDO_STUDIO_HOME = $env:USERPROFILE
          node -e "const lic=require('./_sudo-studio-source/sudo-ai-extension/src/license/license');const s=lic.getStatus({});console.log('license state='+s.state+' edition='+s.edition);if(s.state!=='active'||['team','enterprise'].indexOf(s.edition)===-1){console.error('license reason: '+s.reason);process.exit(1)}"
          if ($LASTEXITCODE -ne 0) { throw 'CI license invalid (see log)' }
      - name: Install + backend + live copy + render (main path)
        shell: powershell
        run: |
          $dir = Join-Path $env:TEMP 'SudoPanel'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $ip = Start-Process -FilePath (Join-Path (Get-Location) 'panel-dl\SudoStudio-Setup.exe') -ArgumentList '/SILENT','/NORESTART',("/DIR=$dir") -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw 'panel install failed' }
          $be = Start-Process -FilePath (Join-Path $dir 'backend.exe') -WorkingDirectory $dir -WindowStyle Hidden -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-WebRequest 'http://127.0.0.1:5000/api/system/health' -TimeoutSec 3 -UseBasicParsing; if ($r.StatusCode -lt 500) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw 'backend :5000 never came up' }
          $live = Join-Path $env:LOCALAPPDATA 'SudoStudio\extensions'
          if (Test-Path $live) { Remove-Item $live -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $live | Out-Null
          Copy-Item (Join-Path $dir 'extensions\sudo-ai') (Join-Path $live 'sudo-ai') -Recurse -Force
          $udata = Join-Path $env:TEMP 'SudoPanelUser'
          if (Test-Path $udata) { Remove-Item $udata -Recurse -Force }
          node _sudo-studio-source\scripts\ci\panel-render-test.js --install-dir $dir --live-dir $live --user-data-dir $udata --out-dir panel-out --label main
          if ($LASTEXITCODE -ne 0) { throw 'panel render (main path) failed' }
      - name: Render on paren path (P35-c)
        shell: powershell
        run: |
          $dir2 = 'C:\ptest (x86)\SudoStudio'
          if (Test-Path 'C:\ptest (x86)') { Remove-Item 'C:\ptest (x86)' -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir2 | Out-Null
          Copy-Item (Join-Path $env:TEMP 'SudoPanel\*') $dir2 -Recurse -Force
          $udata2 = Join-Path $env:TEMP 'SudoPanelUser2'
          if (Test-Path $udata2) { Remove-Item $udata2 -Recurse -Force }
          node _sudo-studio-source\scripts\ci\panel-render-test.js --install-dir $dir2 --live-dir (Join-Path $env:LOCALAPPDATA 'SudoStudio\extensions') --user-data-dir $udata2 --out-dir panel-out2 --debug-port 9232 --label paren --skip-shortcuts
          if ($LASTEXITCODE -ne 0) { throw 'panel render (paren path) failed' }
      - name: start.bat PHASE 5 + hidden launch (P35-c/d)
        shell: powershell
        run: |
          $dir2 = 'C:\ptest (x86)\SudoStudio'
          $logf = Join-Path $env:LOCALAPPDATA 'SudoStudio\logs\startup.log'
          Get-ChildItem $dir2 -File | Select-Object -First 40 Name, Length | Out-Host
          if (-not (Test-Path (Join-Path $dir2 'start.bat'))) { throw 'start.bat missing in paren copy' }
          $capdir = Join-Path (Get-Location) 'panel-out2'
          New-Item -ItemType Directory -Force -Path $capdir | Out-Null
          $cap = Join-Path $capdir 'phase5-stdout.log'
          # <nul keeps any pause from hanging; stdout captured for forensics.
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', ('start.bat <nul > "' + $cap + '" 2>&1') -WorkingDirectory $dir2 -WindowStyle Minimized -PassThru
          $ph5 = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $logf) -and (Select-String -Path $logf -Pattern '\[PHASE 5\]' -Quiet)) { $ph5 = $true; break }
          }
          $p.Refresh()
          if ($p.HasExited) { ('launcher EXITED early with code ' + $p.ExitCode) | Out-Host }
          else { 'launcher still running after wait (hung or slow)' | Out-Host }
          if (Test-Path $logf) { Copy-Item $logf (Join-Path $capdir 'startup-phase5.log') -Force }
          if (Test-Path $cap) { Get-Content $cap -Tail 30 | Out-Host } else { 'NO phase5-stdout.log captured' | Out-Host }
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          if (-not $ph5) { throw 'start.bat never reached PHASE 5 (see phase5-stdout.log + startup-phase5.log)' }
          if (Select-String -Path $logf -Pattern '\[FATAL\]' -Quiet) { throw 'start.bat logged [FATAL]' }
          Get-Process -Name 'SudoStudio' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $before = @(Get-Process -Name 'cmd' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | ForEach-Object { $_.Id })
          Start-Process -FilePath 'wscript.exe' -ArgumentList "`"$dir2\launch_hidden.vbs`"", "`"$dir2\start.bat`"" -WorkingDirectory $dir2
          $titled = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $w = Get-Process -Name 'SudoStudio' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like 'Sudo Studio*' }
            if ($w) { $titled = $true; break }
          }
          if (-not $titled) { throw 'no editor window titled Sudo Studio after hidden launch' }
          $newCon = @(Get-Process -Name 'cmd' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 -and $before -notcontains $_.Id })
          if ($newCon.Count -gt 0) { throw 'a visible console window appeared during hidden launch' }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $g.Dispose()
          $bmp.Save((Join-Path (Get-Location) 'panel-out2\desktop-hidden.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Get-Process -Name 'SudoStudio' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Uninstall (panel + paren copies)
        if: always()
        shell: powershell
        run: |
          Get-Process -Name 'backend','runtime','SudoStudio' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $un = Join-Path $env:TEMP 'SudoPanel\unins000.exe'
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList '/SILENT','/NORESTART' -Wait }
          Remove-Item (Join-Path $env:TEMP 'SudoPanel') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\ptest (x86)' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:TEMP 'SudoPanelUser') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:TEMP 'SudoPanelUser2') -Recurse -Force -ErrorAction SilentlyContinue
      - name: Collect startup.log on failure
        if: failure()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path (Get-Location) 'panel-out2') | Out-Null
          $logf = Join-Path $env:LOCALAPPDATA 'SudoStudio\logs\startup.log'
          if (Test-Path $logf) { Copy-Item $logf (Join-Path (Get-Location) 'panel-out2\startup.log') -Force; Get-Content $logf -Tail 40 }
          else { 'NO startup.log at ' + $logf | Out-Host }
      - name: Upload panel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-render
          path: |
            panel-out/
            panel-out2/
          if-no-files-found: warn
